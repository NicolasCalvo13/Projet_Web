<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="author" content="Jérémy GALLET">
  <meta name="description" content="{{ meta_description|default('Stage-Link, plateforme de stages.') }}">
  <title>{% block title %}{{ page_title|default('Stage-Link') }}{% endblock %}</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
  <div class="sticky-wrapper">
    <header class="header-style">
      <a href="/?uri=home" class="logo-placement">
        <img src="../assets/images/logo.png" alt="Logo StageLink" width="200">
      </a>

      <div class="header-search">
        <form action="/" method="GET">
          <input type="hidden" name="uri" value="search">
          <input type="text" name="q" placeholder="Métier, ville, mots-clés..." value="{{ keyword ?? '' }}" required>
          <button type="submit" title="Rechercher">🔍</button>
        </form>
      </div>

      <div class="btn-placement">
        <a href="/?uri=login" class="btn-compte">
          <img src="../assets/images/icon-user.png" alt="Mon compte" width="50" height="50">
        </a>
        <a href="/?uri=wishlist" class="btn-favs">
          <img src="../assets/images/icon-fav.png" alt="Favoris" width="50" height="50">
        </a>
      </div>
    </header>

    <nav class="navbar">
      <a href="/?uri=home">Accueil</a> |
      <a href="/?uri=offers">Toutes les Offres</a> |
      <a href="/?uri=it_offers">Offres Informatiques</a> |
      <a href="/?uri=btp_offers">Offres BTP</a> |
      <a href="/?uri=all_reviews">Avis</a> |
      <a href="/?uri=contact">Contact</a>
    </nav>
  </div>

  <main>
    {% block body %}{% endblock %}
  </main>

  <footer class="footer-style">
    <a href="/?uri=legal"><span>Mentions légales</span></a>
    <div>&copy; 2026 - Tous droits réservés</div>
    <a href="/?uri=cookies"><span>Gestion des cookies</span></a>
  </footer>

  <script src="../assets/js/alerts.js"></script>
  <script src="../assets/js/navbar.js"></script>
</body>

</html>
